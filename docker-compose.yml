services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rdp
      POSTGRES_PASSWORD: rdp
      POSTGRES_DB: rdp
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdp -d rdp"]
      interval: 2s
      timeout: 3s
      retries: 30

  dbt:
    build: ./dbt
    environment:
      DBT_HOST: postgres
    volumes:
      - ./dbt:/dbt
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://rdp:rdp@postgres:5432/rdp
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
