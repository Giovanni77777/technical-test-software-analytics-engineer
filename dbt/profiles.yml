rdp_symptoms:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('DBT_USER', 'rdp') }}"
      password: "{{ env_var('DBT_PASSWORD', 'rdp') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'rdp') }}"
      schema: analytics
      threads: 4
